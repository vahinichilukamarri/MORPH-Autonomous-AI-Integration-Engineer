[project]
name = "morph-bench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "morph-backend",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
embeddings = [
    "fastembed>=0.8.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["morph_bench", "scripts", "tests", "oracle", "smoke_tests"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: needs Docker and the sandbox image"]

[tool.uv.sources]
morph-backend = { path = "../backend", editable = true }

[tool.ruff.lint.per-file-ignores]
"oracle/test_oracle.py" = ["E501"]
"oracle/test_review_gate.py" = ["E501"]
"oracle/test_added_after_first_d_run.py" = ["E501"]
"oracle/test_eval_script.py" = ["E501"]
"morph_bench/codegen_eval.py" = ["E501"]
"scripts/run_codegen_eval.py" = ["E501"]
