id: support_user_to_crm_customer
description: >-
  The reverse direction: create CRM customers from Support desk users. Several fields are
  genuinely hard here: the id must come from externalRef (and cannot be invented for users that
  were never imported), the joined name has to be split, the phone gets its "+" back, the epoch
  becomes an ISO string, and the CRM segment cannot be recovered from the support tier.
source:
  system: support
  entity: User
target:
  system: crm
  entity: Customer
requirement: >-
  Sales wants everyone who is known to the support desk to also be visible in the CRM, so
  account managers can see who is already in contact with the company and follow up with them.
  The CRM record should reflect the person's contact details, whether their account is active,
  and when they first appeared.
