# Hand-written reference pipelines in the backend DSL, one per non-UNRESOLVED answer-key entry.
# They prove every key entry is expressible and consistent. They are never imported by the
# backend and never shown to any prompt.
scenario_id: crm_customer_to_support_user
pipelines:
  userId:
    steps:
      - { op: COPY, field: customer_id }
      - { op: REGEX_EXTRACT, pattern: "^C-(\\d+)$", group: 1 }
      - { op: CAST, to: int }
  externalRef:
    steps:
      - { op: COPY, field: customer_id }
  fullName:
    steps:
      - { op: JOIN_NONNULL, fields: [first_name, last_name], separator: " ", trim: true }
  email_address:
    steps:
      - { op: COPY, field: email }
  phoneNumber:
    steps:
      - { op: COPY, field: phone }
      - { op: STRIP_PREFIX, prefix: "+" }
  accountState:
    steps:
      - { op: COPY, field: status }
      - op: MAP_ENUM
        mapping: { ACTIVE: ENABLED, INACTIVE: DISABLED, SUSPENDED: BLOCKED }
  tier:
    steps:
      - { op: COPY, field: segment }
      - op: MAP_ENUM
        mapping: { SMB: STANDARD, MIDMARKET: STANDARD, ENTERPRISE: PRIORITY }
  createdAt:
    steps:
      - { op: COPY, field: created_at }
      - { op: FORMAT_DATETIME, from_format: iso8601, to_format: epoch_s }
