[project]
name = "morph-runtime"
version = "0.1.0"
description = "Trusted, hand-written runtime used by generated integrations (stdlib only)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.152.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["morph_runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["morph_runtime", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
