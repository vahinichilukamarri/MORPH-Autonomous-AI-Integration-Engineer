name: morph

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morph}
      POSTGRES_DB: ${POSTGRES_DB:-morph}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-crm:
    build: ./mock_systems
    command: ["uvicorn", "crm.main:app", "--host", "0.0.0.0", "--port", "8101"]
    environment:
      CRM_API_KEY: ${CRM_API_KEY:-crm-dev-key}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-dev-token}
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/openapi.json')"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-support:
    build: ./mock_systems
    command: ["uvicorn", "support.main:app", "--host", "0.0.0.0", "--port", "8102"]
    environment:
      SUPPORT_TOKEN: ${SUPPORT_TOKEN:-support-dev-token}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-dev-token}
    ports:
      - "8102:8102"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/openapi.json')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
