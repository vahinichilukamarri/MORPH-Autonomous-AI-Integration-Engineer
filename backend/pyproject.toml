[project]
name = "morph-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=2.3.0,<3",
    "openapi-spec-validator>=0.9.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
embeddings = [
    "fastembed>=0.8.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "../sandbox/runtime"
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../sandbox/runtime"]
addopts = "-m 'not slow and not docker'"
markers = [
    "slow: needs the real embedding model (downloads it); run with `pytest -m slow`",
    "docker: needs Docker and the sandbox/mock images; run with `pytest -m docker`",
]

[tool.ruff.lint.per-file-ignores]
"tests/policy/evalkit/report.py" = ["E501"]  # the report text is written as long literal lines
"tests/codegen/test_containment.py" = ["E501"]
"tests/codegen/test_gate.py" = ["E501"]
"tests/codegen/test_llm_codegen.py" = ["E501"]
