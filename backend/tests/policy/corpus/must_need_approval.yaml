# must_need_approval: generated once from a script, now edited by hand. The counts are fixed in
# docs/plans/v0.6-m4-preregistration.md and checked by tests/policy/test_corpora.py.
- id: N-propose_mapping-internal
  group: model call on data that is not synthetic
  description: propose_mapping on a mock system whose data is internal
  steps:
  - world:
      name: w
      environment: mock
      data_class: internal
  - call:
      tool: propose_mapping
      args: &id001
        source_system_version: $w.source_version_id
        target_system_version: $w.target_version_id
        source_entity: Customer
        target_entity: User
  expect:
    status: needs_approval
    reason: MODEL_DATA_NOT_SYNTHETIC
    handler: not_run
    self_describing: true
- id: N-propose_mapping-restricted
  group: model call on data that is not synthetic
  description: propose_mapping on a mock system whose data is restricted
  steps:
  - world:
      name: w
      environment: mock
      data_class: restricted
  - call:
      tool: propose_mapping
      args: *id001
  expect:
    status: needs_approval
    reason: MODEL_DATA_NOT_SYNTHETIC
