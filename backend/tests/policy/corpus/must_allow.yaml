# must_allow: generated once from a script, now edited by hand. The counts are fixed in
# docs/plans/v0.6-m4-preregistration.md and checked by tests/policy/test_corpora.py.
- id: A-READ-reader-list_systems
  group: read tools
  description: a reader calls list_systems
  steps:
  - rig:
      role: operator
  - world:
      name: w
      environment: mock
      data_class: synthetic
  - role:
      role: reader
  - call:
      tool: list_systems
      args: &id003 {}
  expect: &id001
    status: ok
    handler: ran
