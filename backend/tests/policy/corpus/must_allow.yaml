- id: A-APPROVED-propose
  group: approved calls
  description: propose_mapping on internal data, approved
  steps:
  - world:
      name: w
      environment: mock
      data_class: internal
  - call:
      tool: propose_mapping
      args:
        source_system_version: $w.source_version_id
        target_system_version: $w.target_version_id
        source_entity: Customer
        target_entity: User
      save: a
  - decide:
      approval: $a.approval_id
      approve: true
  - call:
      tool: propose_mapping
      args:
        source_system_version: $w.source_version_id
        target_system_version: $w.target_version_id
        source_entity: Customer
        target_entity: User
        approval_id: $a.approval_id
  expect: *id001
