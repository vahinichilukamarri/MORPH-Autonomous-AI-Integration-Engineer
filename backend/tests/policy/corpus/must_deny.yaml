# must_deny: generated once from a script, now edited by hand. The counts are fixed in
# docs/plans/v0.6-m4-preregistration.md and checked by tests/policy/test_corpora.py.
- id: D-ROLE-1
  group: role scope
  description: a reader calls ingest_contract
  steps:
  - rig:
      role: reader
  - world:
      name: w
      environment: mock
      data_class: synthetic
  - call:
      tool: ingest_contract
      args:
        file: crm.v1.json
        name: crm-role
  expect:
    status: denied
    reason: ROLE_NOT_PERMITTED
    handler: not_run
- id: D-ROLE-2
  group: role scope
  description: a reader calls propose_mapping
  steps:
  - rig:
      role: reader
  - world:
      name: w
      environment: mock
      data_class: synthetic
  - call:
      tool: propose_mapping
      args: &id003
        source_system_version: $w.source_version_id
        target_system_version: $w.target_version_id
        source_entity: Customer
        target_entity: User
  expect:
    status: denied
    reason: ROLE_NOT_PERMITTED
    handler: not_run
