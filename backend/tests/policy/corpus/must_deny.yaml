- id: D-BUDGET-1
  group: budget
  description: model calls used up, then another model call
  steps:
  - rig:
      limits:
        max_model_calls: 3
  - world:
      name: w
      environment: mock
      data_class: synthetic
  - call:
      tool: propose_mapping
      args: *id003
      save: first
  - call:
      tool: propose_mapping
      args: *id003
  expect:
    status: denied
    reason: BUDGET_EXCEEDED
    handler: not_run
- id: D-BUDGET-2
  group: budget
  description: sandbox runs used up, then run_generated_tests
  steps:
  - rig:
      limits:
        max_sandbox_runs: 2
  - world:
      name: w
      environment: mock
      data_class: synthetic
  - call:
      tool: generate_integration
      args: *id001
      save: gen
  - call:
      tool: run_generated_tests
      args:
        integration_id: $gen.result.integration_id
        version: $gen.result.version
  expect:
    status: denied
    reason: BUDGET_EXCEEDED
    handler: not_run
- id: D-BUDGET-3
  group: budget
  description: the model budget runs out in the middle of a repair run
  steps:
  - rig:
      limits:
        max_model_calls: 2
      replies:
      - not json
      - not json 2
      - x
      - y
  - world:
      name: w
      environment: mock
      data_class: synthetic
  - call:
      tool: repair_integration
      args: *id002
  expect:
    status: budget_exceeded
    reason: BUDGET_EXCEEDED
    handler: ran
- id: D-BUDGET-4
  group: budget
  description: the sandbox budget runs out in the middle of a generation
  steps:
  - rig:
      limits:
        max_sandbox_runs: 1
  - world:
      name: w
      environment: mock
      data_class: synthetic
  - call:
      tool: generate_integration
      args: *id001
  expect:
    status: budget_exceeded
    reason: BUDGET_EXCEEDED
    handler: ran
- id: D-APPROVAL-1
  group: approval abuse
  description: a consumed approval replayed
  steps:
  - world:
      name: w
      environment: mock
      data_class: internal
  - call:
      tool: propose_mapping
      args: &id004
        source_system_version: $w.source_version_id
        target_system_version: $w.target_version_id
        source_entity: Customer
        target_entity: User
      save: a
  - decide:
      approval: $a.approval_id
      approve: true
  - call:
      tool: propose_mapping
      args:
        source_system_version: $w.source_version_id
        target_system_version: $w.target_version_id
        source_entity: Customer
        target_entity: User
        approval_id: $a.approval_id
      save: used
  - call:
      tool: propose_mapping
      args:
        source_system_version: $w.source_version_id
        target_system_version: $w.target_version_id
        source_entity: Customer
        target_entity: User
        approval_id: $a.approval_id
  expect:
    status: denied
    reason: APPROVAL_INVALID
    handler: not_run
    body:
      approval_check: CONSUMED
- id: D-APPROVAL-2
  group: approval abuse
  description: an approval for different arguments
  steps:
  - world:
      name: w
      environment: mock
      data_class: internal
  - call:
      tool: propose_mapping
      args: *id004
      save: a
  - decide:
      approval: $a.approval_id
      approve: true
  - call:
      tool: propose_mapping
      args:
        source_system_version: $w.source_version_id
        target_system_version: $w.target_version_id
        source_entity: Customer
        target_entity: Other
        approval_id: $a.approval_id
  expect:
    status: denied
    reason: APPROVAL_INVALID
    handler: not_run
    body:
      approval_check: REQUEST_MISMATCH
- id: D-APPROVAL-3
  group: approval abuse
  description: an approval for a different tool
  steps:
  - world:
      name: w
      environment: mock
      data_class: internal
  - call:
      tool: propose_mapping
      args: *id004
      save: a
  - decide:
      approval: $a.approval_id
      approve: true
  - call:
      tool: generate_integration
      args:
        mapping_run_id: $w.mapping_run_id
        condition: L1
        approval_id: $a.approval_id
  expect:
    status: denied
    reason: APPROVAL_INVALID
    handler: not_run
    body:
      approval_check: REQUEST_MISMATCH
- id: D-APPROVAL-4
  group: approval abuse
  description: an expired approval
  steps:
  - world:
      name: w
      environment: mock
      data_class: internal
  - call:
      tool: propose_mapping
      args: *id004
      save: a
  - decide:
      approval: $a.approval_id
      approve: true
  - clock:
      seconds: 1900
  - call:
      tool: propose_mapping
      args:
        source_system_version: $w.source_version_id
        target_system_version: $w.target_version_id
        source_entity: Customer
        target_entity: User
        approval_id: $a.approval_id
  expect:
    status: denied
    reason: APPROVAL_INVALID
    handler: not_run
    body:
      approval_check: EXPIRED
- id: D-APPROVAL-5
  group: approval abuse
  description: an approval after a change of policy
  steps:
  - world:
      name: w
      environment: mock
      data_class: internal
  - call:
      tool: propose_mapping
      args: *id004
      save: a
  - decide:
      approval: $a.approval_id
      approve: true
  - switch_policy:
      limits:
        max_model_calls: 30
  - call:
